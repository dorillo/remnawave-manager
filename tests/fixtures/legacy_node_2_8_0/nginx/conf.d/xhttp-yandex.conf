# Yandex Cloud CDN origin and XHTTP stream separation are user-owned.
upstream xray_xhttp {
    server unix:/dev/shm/xray-xhttp.sock;
}

server {
    listen unix:/dev/shm/nginx.sock ssl proxy_protocol;
    server_name node.example.test;

    location /cdn-assets/opaque-path/ {
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Yandex-CDN yes;
        proxy_pass http://xray_xhttp;
    }
}
