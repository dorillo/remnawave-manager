gzip on;
gzip_types application/json text/css;

map $http_cookie $legacy_cookie_gate {
    default 0;
    "~*rwm_access=legacy-cookie" 1;
}

upstream remnawave_panel {
    server 127.0.0.1:3000;
}

upstream remnawave_subscription {
    server 127.0.0.1:3010;
}

server {
    listen 443 ssl;
    server_name panel.example.test;
    if ($legacy_cookie_gate = 0) { return 404; }
    location / { proxy_pass http://remnawave_panel; }
}

server {
    listen 443 ssl;
    server_name sub.example.test;
    location / { proxy_pass http://remnawave_subscription; }
}
