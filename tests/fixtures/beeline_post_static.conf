server_names_hash_bucket_size 128;
server_tokens off;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ecdh_curve X25519:prime256v1:secp384r1;
ssl_session_timeout 1d;
ssl_session_cache shared:RemnawaveTLS:10m;
ssl_session_tickets off;

upstream beeline_xhttp {
    server 127.0.0.1:7443;
    keepalive 256;
    keepalive_timeout 30s;
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name node.example.test;
    return 308 https://$host$request_uri;
}

server {
    listen unix:/dev/shm/nginx.sock ssl proxy_protocol;
    http2 on;
    server_name node.example.test;
    ssl_certificate "/etc/letsencrypt/live/node.example.test/fullchain.pem";
    ssl_certificate_key "/etc/letsencrypt/live/node.example.test/privkey.pem";
    ssl_trusted_certificate "/etc/letsencrypt/live/node.example.test/fullchain.pem";
    root /var/www/html;
    index index.html;
    real_ip_header proxy_protocol;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;

    location = /source/origin {
        proxy_pass http://beeline_xhttp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_socket_keepalive on;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_max_temp_file_size 0;
        proxy_next_upstream off;
        gzip off;
        client_max_body_size 0;
        client_body_timeout 86400s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        send_timeout 86400s;
    }

    location ^~ /source/origin/ {
        proxy_pass http://beeline_xhttp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_socket_keepalive on;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_max_temp_file_size 0;
        proxy_next_upstream off;
        gzip off;
        client_max_body_size 0;
        client_body_timeout 86400s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        send_timeout 86400s;
    }

    location ~ (^|/)\. {
        return 404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(?:css|js|png|jpg|jpeg|webp|avif|ico|woff2)$ {
        expires 7d;
        try_files $uri =404;
    }
}

server {
    listen unix:/dev/shm/nginx.sock ssl proxy_protocol default_server;
    server_name _;
    ssl_reject_handshake on;
}
